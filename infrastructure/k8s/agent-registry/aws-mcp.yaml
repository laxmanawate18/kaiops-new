apiVersion: ai.google.cloud/v1alpha
kind: MCPServer
metadata:
  name: aws-mcp
  description: "AWS CloudWatch and EKS monitoring tools"
spec:
  image: gcr.io/${PROJECT_ID}/aws-mcp-server:latest
  env:
    - name: AWS_REGION
      valueFrom:
        secretKeyRef:
          name: aws-credentials
          key: region
