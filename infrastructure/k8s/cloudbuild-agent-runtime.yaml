# Builds + pushes the KaiOps Agent Platform Runtime (BYOC) container image.
# The runtime container implements the Agent Platform runtime contract and is
# consumed by Agent Runtime (agent_engines.create).
steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/mcp-servers/kaiops-agent-runtime:latest'
      - '-f'
      - 'infrastructure/docker/Dockerfile.runtime'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/mcp-servers/kaiops-agent-runtime:latest'
    waitFor: ['build']
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/mcp-servers/kaiops-agent-runtime:latest'
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
timeout: '2400s'
