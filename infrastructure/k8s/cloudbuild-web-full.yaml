# Cloud Build: FULL source build of kaiops-web via the standard
# infrastructure/docker/Dockerfile.web (node:20 npm ci + vite build -> nginx).
# Supersedes the layered :gzip-1 patch image now that the app builds again.
# Explicit BACKEND_* build-args guarantee the nginx envsubst placeholders are
# populated even if the builder env lacks them (cause of the earlier failure).
# New tag :ui-fixes-1 (+ :latest refresh).

substitutions:
  _IMAGE: 'us-central1-docker.pkg.dev/project-3da8cb5f-328e-44d3-b7a/cloud-run-source-deploy/kaiops-web'
  _BACKEND_URL: 'https://sre-agent-backend-275388304596.us-central1.run.app'

steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-web-full'
    args:
      - 'build'
      - '--build-arg'
      - 'BACKEND_URL=${_BACKEND_URL}'
      - '--build-arg'
      - 'BACKEND_HOST=sre-agent-backend-275388304596.us-central1.run.app'
      - '-t'
      - '${_IMAGE}:ui-fixes-1'
      - '-t'
      - '${_IMAGE}:latest'
      - '-f'
      - 'infrastructure/docker/Dockerfile.web'
      - '.'

images:
  - '${_IMAGE}:ui-fixes-1'
  - '${_IMAGE}:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1800s'
