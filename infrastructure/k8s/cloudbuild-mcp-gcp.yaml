steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args: ['build','-t','gcr.io/$PROJECT_ID/gcp-mcp-server:latest','-f','infrastructure/docker/Dockerfile.mcp','.']
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args: ['push','gcr.io/$PROJECT_ID/gcp-mcp-server:latest']
    waitFor: ['build']
images: ['gcr.io/$PROJECT_ID/gcp-mcp-server:latest']
options: {logging: CLOUD_LOGGING_ONLY}
timeout: '1800s'
