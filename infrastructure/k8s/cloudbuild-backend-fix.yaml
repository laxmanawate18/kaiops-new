steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args: ['build','-t','us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/kaiops-backend:aws-fix-1','-t','us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/kaiops-backend:latest','-f','infrastructure/docker/Dockerfile.backend','.']
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args: ['push','us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/kaiops-backend:aws-fix-1']
    waitFor: ['build']
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-latest'
    args: ['push','us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/kaiops-backend:latest']
    waitFor: ['build']
images: ['us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/kaiops-backend:aws-fix-1','us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/kaiops-backend:latest']
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
timeout: '2400s'
