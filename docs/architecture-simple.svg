<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title{font-size:16px;font-weight:700;fill:#0f172a}
      .box-label{font-size:12px;font-weight:600;fill:#334155}
      .box-sub{font-size:10px;fill:#64748b}
      .pill{font-size:10px;fill:#0f766e}
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="620" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" class="title">KaiOps — Governed Multi-Cloud SRE Agent Fleet</text>
  <text x="600" y="48" text-anchor="middle" font-size="11" fill="#64748b">Model: Gemini Enterprise Agent Platform · gemini-3.6-flash (Vertex AI)</text>

  <!-- =============== ROW 1: main flow (left -> right) =============== -->
  <!-- 1 Vertex AI -->
  <rect x="30" y="80" width="150" height="80" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="105" y="112" text-anchor="middle" class="box-label">Vertex AI</text>
  <text x="105" y="128" text-anchor="middle" class="box-sub">gemini-3.6-flash</text>
  <text x="105" y="144" text-anchor="middle" class="box-sub">(Agent Platform)</text>

  <!-- arrow 1->2 -->
  <line x1="180" y1="120" x2="214" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2 KaiOps orchestrator -->
  <rect x="215" y="70" width="220" height="100" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="325" y="95" text-anchor="middle" class="box-label">KaiOps Orchestrator</text>
  <text x="325" y="112" text-anchor="middle" class="box-sub">Agent Engine · Registry</text>
  <text x="325" y="126" text-anchor="middle" class="box-sub">Agent Identity · Gateway</text>
  <text x="325" y="140" text-anchor="middle" class="box-sub">Semantic Governance</text>

  <!-- arrow 2->3 -->
  <line x1="435" y1="120" x2="469" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3 A2A specialists -->
  <rect x="470" y="70" width="210" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="575" y="95" text-anchor="middle" class="box-label">3 A2A Specialists</text>
  <text x="575" y="112" text-anchor="middle" class="box-sub">Cloud Run (iaM)</text>
  <text x="575" y="128" text-anchor="middle" class="box-sub">gcp · aws · azure</text>

  <!-- arrow 3->4 -->
  <line x1="680" y1="120" x2="714" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4 MCP servers -->
  <rect x="715" y="70" width="210" height="100" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="820" y="95" text-anchor="middle" class="box-label">6 MCP Servers</text>
  <text x="820" y="112" text-anchor="middle" class="box-sub">Cloud Run (IAM-private)</text>
  <text x="820" y="128" text-anchor="middle" class="box-sub">argocd · aws · azure · gcp ·</text>
  <text x="820" y="142" text-anchor="middle" class="box-sub">github · grafana</text>

  <!-- arrow 4->5 -->
  <line x1="925" y1="120" x2="959" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5 Managed estate -->
  <rect x="960" y="70" width="210" height="100" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="1065" y="95" text-anchor="middle" class="box-label">Managed Estate</text>
  <text x="1065" y="112" text-anchor="middle" class="box-sub">GKE · EKS · AKS</text>
  <text x="1065" y="128" text-anchor="middle" class="box-sub">(investigated estate)</text>

  <!-- =============== ROW 2: autonomous loop (below) =============== -->
  <rect x="30" y="210" width="1140" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="50" y="232" font-size="11" font-weight="700" fill="#334155">Autonomous Loop</text>
  <text x="50" y="250" font-size="11" fill="#475569">Webhook (ArgoCD Degraded / K8s crash)
    → Firestore agent_jobs[PENDING]
    → worker claims (CAS) → RCA (search_knowledge)
    → Slack report + console deep-link
    → HITL Approve/Reject → cloud-aware remediation</text>

  <!-- =============== ROW 3: Firestore + governance =============== -->
  <rect x="30" y="300" width="1140" height="90" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="50" y="318" width="170" height="56" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="135" y="342" text-anchor="middle" class="box-label">Firestore</text>
  <text x="135" y="358" text-anchor="middle" class="box-sub">state · jobs · sessions</text>

  <rect x="250" y="318" width="185" height="56" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/>
  <text x="342" y="342" text-anchor="middle" class="box-label">Model Armor</text>
  <text x="342" y="358" text-anchor="middle" class="box-sub">template kaiops-governance</text>

  <rect x="465" y="318" width="185" height="56" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/>
  <text x="557" y="342" text-anchor="middle" class="box-label">HITL Gate</text>
  <text x="557" y="358" text-anchor="middle" class="box-sub">destructive tools gated</text>

  <rect x="680" y="318" width="185" height="56" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/>
  <text x="772" y="342" text-anchor="middle" class="box-label">Agent Registry</text>
  <text x="772" y="358" text-anchor="middle" class="box-sub">TOOL_SPEC · 43 tools</text>

  <rect x="895" y="318" width="180" height="56" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/>
  <text x="985" y="342" text-anchor="middle" class="box-label">Agent Gateway</text>
  <text x="985" y="358" text-anchor="middle" class="box-sub">egress allowlist · IAP</text>

  <!-- footer -->
  <text x="600" y="430" text-anchor="middle" font-size="10" fill="#94a3b8">Draft — restyle via docs/architecture-simple.mmd</text>
</svg>
