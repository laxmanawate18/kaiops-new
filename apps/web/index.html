<!doctype html>
<html lang="en" class="dark">

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..600&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui; color: #e6edf6; background: #05070d">
        KaiOPS requires JavaScript to run.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>

</html>
